[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocabops"
version = "0.1.0"
description = "Corpus-driven English vocabulary for software engineers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "wordfreq>=3.1",
]

[project.optional-dependencies]
# Ingestion-only: the CodeSearchNet adapter reads parquet. Never a runtime
# dependency of the published package.
ingest = [
    "pyarrow>=15",
]
# POS tagging & dependency-based collocation extraction (local CPU or GPU).
nlp = [
    "spacy>=3.7",
]
# Google Colab GPU enrichment extra (Transformer spaCy model + HF datasets).
colab = [
    "spacy>=3.7",
    "spacy-transformers>=1.3",
    "huggingface_hub>=0.25",
    "pyarrow>=15",
]
# GPU open-model batch draft curation (Japanese glosses, examples, categories).
draft = [
    "transformers>=4.46",
    "accelerate>=1.0",
]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
