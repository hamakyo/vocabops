[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocabops"
version = "0.1.0"
description = "Corpus-driven English vocabulary for software engineers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "wordfreq>=3.1",
]

[project.optional-dependencies]
# Ingestion-only: the CodeSearchNet adapter reads parquet. Never a runtime
# dependency of the published package.
ingest = [
    "pyarrow>=15",
]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
